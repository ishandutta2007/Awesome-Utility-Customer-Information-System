<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Animated Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#3b82f6;#10b981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite;
    }
    .float-orb {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid-pattern)" />

  <!-- Outer Glow Border -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Ambient Light Orbs -->
  <g filter="url(#glow)">
    <circle cx="1020" cy="110" r="90" fill="#0284c7" fill-opacity="0.25" class="pulse-circle" style="transform-origin: 1020px 110px;" />
    <circle cx="180" cy="270" r="80" fill="#10b981" fill-opacity="0.2" class="pulse-circle" style="transform-origin: 180px 270px; animation-delay: 1.5s;" />
    <circle cx="850" cy="280" r="70" fill="#6366f1" fill-opacity="0.2" class="pulse-circle" style="transform-origin: 850px 280px; animation-delay: 0.8s;" />
  </g>

  <!-- Flowing Dynamic Data Wave Path -->
  <path d="M 0 300 Q 300 240, 600 290 T 1200 270" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 4">
    <animate attributeName="stroke-dashoffset" values="0;120" dur="10s" repeatCount="indefinite" />
  </path>
  <path d="M 0 320 Q 300 280, 600 310 T 1200 290" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="120;0" dur="12s" repeatCount="indefinite" />
  </path>

  <!-- Left Category Pill / Badge -->
  <g transform="translate(80, 52)">
    <rect width="260" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="19" class="badge-text">⚡ ENTERPRISE UTILITY ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="130" fill="url(#text-grad)" class="title-text">Awesome Utility CIS</text>
  <text x="80" y="172" fill="#f8fafc" class="title-text" font-size="30" font-weight="600">Customer Information Systems</text>

  <!-- Subtitle & Pillars -->
  <text x="80" y="215" class="subtitle-text">
    Curated Hub for Meter-to-Cash, Smart Billing, MDM, Rate Engines &amp; Customer Care
  </text>
  <text x="80" y="242" class="subtitle-text" font-size="14" fill="#64748b">
    ⚡ Electric Utilities &nbsp;•&nbsp; 💧 Water Networks &nbsp;•&nbsp; 🔥 Gas Distribution &nbsp;•&nbsp; 🏢 District Energy &amp; Municipalities
  </text>

  <!-- Feature Highlights Tags -->
  <g transform="translate(80, 275)">
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#38bdf8" font-weight="500">💳 Meter-to-Cash</text>
    </g>
    <g transform="translate(140, 0)">
      <rect width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#34d399" font-weight="500">📊 MDM &amp; Tariffs</text>
    </g>
    <g transform="translate(280, 0)">
      <rect width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#a78bfa" font-weight="500">☁️ SaaS &amp; Open Source</text>
    </g>
    <g transform="translate(425, 0)">
      <rect width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#fbbf24" font-weight="500">🔒 Enterprise CIS</text>
    </g>
  </g>

  <!-- Right Graphic: Isometric CIS & Smart Meter / Grid Illustration -->
  <g transform="translate(940, 160)" class="float-orb">
    <!-- Center Hexagon / Core -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0f172a" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Central Grid Icon -->
    <circle cx="0" cy="0" r="24" fill="#0284c7" fill-opacity="0.3" />
    <path d="M -8 -8 L 8 8 M 8 -8 L -8 8 M 0 -12 L 0 12 M -12 0 L 12 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Satellite Nodes -->
    <g transform="translate(0, -95)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="5" font-size="12" text-anchor="middle" fill="#ffffff">⚡</text>
      <line x1="0" y1="18" x2="0" y2="35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <g transform="translate(85, -45)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#34d399" stroke-width="2" />
      <text x="0" y="5" font-size="12" text-anchor="middle" fill="#ffffff">💧</text>
      <line x1="-15" y1="8" x2="-33" y2="15" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <g transform="translate(85, 45)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <text x="0" y="5" font-size="12" text-anchor="middle" fill="#ffffff">🔥</text>
      <line x1="-15" y1="-8" x2="-33" y2="-15" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <g transform="translate(-85, 45)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
      <text x="0" y="5" font-size="12" text-anchor="middle" fill="#ffffff">📊</text>
      <line x1="15" y1="-8" x2="33" y2="-15" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <g transform="translate(-85, -45)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <text x="0" y="5" font-size="12" text-anchor="middle" fill="#ffffff">💳</text>
      <line x1="15" y1="8" x2="33" y2="15" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>
  </g>
</svg>
