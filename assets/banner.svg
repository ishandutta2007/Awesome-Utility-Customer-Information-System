<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Header / Border Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
    }
    .title-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 26px;
      fill: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
    }
    .commodity-line {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 13.5px;
      fill: #64748b;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 11.5px;
      fill: #38bdf8;
      letter-spacing: 0.8px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
    }
    .pulse-anim {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .float-anim {
      animation: float 6s ease-in-out infinite alternate;
    }
    .dash-anim {
      animation: dash 12s linear infinite;
    }
    .dash-rev {
      animation: dashRev 15s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.75; transform: scale(1.04); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 120; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid-pattern)" />

  <!-- Outer Border Glow -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-opacity="0.75" />

  <!-- Ambient Light Halos -->
  <circle cx="1020" cy="110" r="100" fill="#0284c7" fill-opacity="0.25" filter="url(#soft-glow)" class="pulse-anim" style="transform-origin: 1020px 110px;" />
  <circle cx="180" cy="270" r="90" fill="#10b981" fill-opacity="0.2" filter="url(#soft-glow)" class="pulse-anim" style="transform-origin: 180px 270px; animation-delay: 2s;" />
  <circle cx="850" cy="280" r="80" fill="#8b5cf6" fill-opacity="0.2" filter="url(#soft-glow)" class="pulse-anim" style="transform-origin: 850px 280px; animation-delay: 1s;" />

  <!-- Dynamic Sine Wave Connection Paths -->
  <path d="M 0 290 Q 300 230, 600 280 T 1200 260" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="8 6" class="dash-anim" />
  <path d="M 0 315 Q 300 270, 600 305 T 1200 285" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 4" class="dash-rev" />

  <!-- Top Pill / Badge -->
  <g transform="translate(80, 48)">
    <rect width="270" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4.5" fill="#38bdf8" />
    <text x="32" y="18" class="badge-pill">⚡ ENTERPRISE UTILITY ECOSYSTEM</text>
  </g>

  <!-- Main Title & Headlines -->
  <text x="80" y="122" fill="url(#text-grad)" class="title-main">Awesome Utility CIS</text>
  <text x="80" y="162" class="title-sub">Customer Information Systems</text>

  <!-- Tagline & Modalities -->
  <text x="80" y="202" class="tagline">Curated Hub for Meter-to-Cash, Smart Billing, MDM, Rate Engines &amp; Customer Care</text>
  <text x="80" y="230" class="commodity-line">⚡ Electric Utilities &#160;•&#160; 💧 Water Networks &#160;•&#160; 🔥 Gas Distribution &#160;•&#160; 🏢 Municipalities &amp; Co-ops</text>

  <!-- Category Feature Chips -->
  <g transform="translate(80, 266)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="28" rx="6" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1" />
      <text x="67" y="18" text-anchor="middle" class="chip-text" fill="#38bdf8">💳 Meter-to-Cash</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(147, 0)">
      <rect width="135" height="28" rx="6" fill="url(#card-grad)" stroke="#059669" stroke-width="1" />
      <text x="67" y="18" text-anchor="middle" class="chip-text" fill="#34d399">📊 MDM &amp; Tariffs</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(294, 0)">
      <rect width="145" height="28" rx="6" fill="url(#card-grad)" stroke="#7c3aed" stroke-width="1" />
      <text x="72" y="18" text-anchor="middle" class="chip-text" fill="#c084fc">☁️ SaaS &amp; Open Source</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(451, 0)">
      <rect width="135" height="28" rx="6" fill="url(#card-grad)" stroke="#d97706" stroke-width="1" />
      <text x="67" y="18" text-anchor="middle" class="chip-text" fill="#fbbf24">🔒 Enterprise CIS</text>
    </g>
  </g>

  <!-- Right Graphic: Isometric Utility Smart Meter & Grid Network -->
  <g transform="translate(940, 165)" class="float-anim">
    <!-- Outer Orbit Circle -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Central CIS Core -->
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="2.5" filter="url(#soft-glow)" />
    <circle cx="0" cy="0" r="20" fill="#0284c7" fill-opacity="0.35" />
    <path d="M -7 -7 L 7 7 M 7 -7 L -7 7 M 0 -10 L 0 10 M -10 0 L 10 0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Satellite Utility Nodes -->
    <!-- Power / Electric -->
    <g transform="translate(0, -95)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="6" font-size="13" text-anchor="middle" fill="#ffffff">⚡</text>
      <line x1="0" y1="18" x2="0" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <!-- Water Network -->
    <g transform="translate(88, -42)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#34d399" stroke-width="2" />
      <text x="0" y="6" font-size="13" text-anchor="middle" fill="#ffffff">💧</text>
      <line x1="-15" y1="8" x2="-40" y2="18" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <!-- Gas Distribution -->
    <g transform="translate(88, 48)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <text x="0" y="6" font-size="13" text-anchor="middle" fill="#ffffff">🔥</text>
      <line x1="-15" y1="-8" x2="-40" y2="-18" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <!-- Analytics & Tariffs -->
    <g transform="translate(-88, 48)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
      <text x="0" y="6" font-size="13" text-anchor="middle" fill="#ffffff">📊</text>
      <line x1="15" y1="-8" x2="40" y2="-18" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>

    <!-- Billing & Revenue -->
    <g transform="translate(-88, -42)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <text x="0" y="6" font-size="13" text-anchor="middle" fill="#ffffff">💳</text>
      <line x1="15" y1="8" x2="40" y2="18" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 3" />
    </g>
  </g>
</svg>
